name: Daily Forecast

on:
  schedule:
    - cron: '10 01 * * 1-6'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache HF datasets
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-cache
        restore-keys: |
          ${{ runner.os }}-hf-cache

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download models from Hugging Face Hub
      run: |
        python -c "
        from huggingface_hub import hf_hub_download

        repo_id = 'P2SAMAPA/p2-etf-rough-path-forecaster-results'
        files = ['fi/fixed/model.pkl', 'equity/fixed/model.pkl']

        for f in files:
            try:
                hf_hub_download(
                    repo_id=repo_id,
                    filename=f,
                    local_dir='./',
                    local_dir_use_symlinks=False
                )
                print(f'Successfully downloaded {f}')
            except Exception as e:
                print(f'Warning: Could not download {f}. It may not exist yet.')
                print(f'Error details: {e}')
        "
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: Run FI predictions
      run: python predict.py --module fi
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: Run Equity predictions
      run: python predict.py --module equity
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: Upload to Hub
      run: python upload_to_hub.py
      continue-on-error: true # Prevents pipeline from failing red before models are trained
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: Clean cache
      run: |
        rm -rf data/cache/*
        rm -rf models_saved/temp_*
